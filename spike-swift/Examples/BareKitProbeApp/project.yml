name: BareKitProbeApp
options:
  bundleIdPrefix: com.qvac.spike
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  QVACSpike:
    path: ../..

targets:
  BareKitProbeApp:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BareKit Probe
        UILaunchStoryboardName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - package: QVACSpike
        product: BareKitProbeLib
      - framework: ../../Vendor/BareKit.xcframework
        embed: true
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.qvac.spike.barekitprobe

  BareKitProbeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BareKitProbeApp
      - package: QVACSpike
        product: BareKitProbeLib
      - framework: ../../Vendor/BareKit.xcframework
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BareKitProbeApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BareKitProbeApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.qvac.spike.barekitprobe.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BareKitProbeApp:
    build:
      targets:
        BareKitProbeApp: all
        BareKitProbeAppTests: [test]
    test:
      targets:
        - BareKitProbeAppTests
