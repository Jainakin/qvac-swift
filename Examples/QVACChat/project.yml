name: QVACChat
options:
  bundleIdPrefix: com.qvac.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  QVACSwift:
    path: ../..

targets:
  QVACChat-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: QVAC Chat
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Empty UILaunchScreen tells iOS to size the app to the full device
        # screen (modern, iOS 14+). Without it, iOS letterboxes the app to
        # a 320x480 iPhone-4 compatibility canvas with black bars top/bottom.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: QVACSwift
        product: QVACClient
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.qvac.example.qvacchat
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  QVACChat-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: QVACSwift
        product: QVACClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.qvac.example.qvacchat.macos
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: "NO"
