name: Bug report
description: Report a reproducible QVACClient problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private prompts, model data, or unredacted paths. Report security issues through the private security advisory link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: QVACClient version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS device
        - iOS Simulator
        - macOS
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, device or Mac model, Xcode, Swift, and QVAC SDK/model details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I removed credentials, prompts, model data, and personal paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
