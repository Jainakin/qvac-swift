name: Build SDK 0.17 Artifacts

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Artifact revision number (2 or higher); creates artifacts-sdk-0.17.0-rN
        required: true
        type: number
      publish:
        description: Reserved; rejected until the reviewed BareKit activation gate is unlocked
        required: true
        default: false
        type: boolean
      license_reviewed:
        description: Confirm legal review of notices and supplements before publication
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  attestations: read
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  # Serialize all revisions so two concurrently dispatched runs cannot publish
  # rN values out of order after observing the same previous maximum.
  group: artifact-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      QVAC_IOS_RUNTIME_VERSION: "17.0"
      QVAC_IOS_RUNTIME_ID: com.apple.CoreSimulator.SimRuntime.iOS-17-0
      QVAC_IOS_DEVICE_TYPE_ID: com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            tools/runtime/package-lock.json
            tools/native/bare-kit/package-lock.json
      # This is an intentional publication kill switch, not a transient failed
      # prerequisite. Remove it only in a separately reviewed commit after every
      # requirement in the pinned BareKit activation ledger is complete.
      - name: Enforce the reviewed BareKit publication kill switch
        if: inputs.publish
        run: |
          echo "::error::Publication is intentionally disabled until every BareKit r2 activation requirement is complete and this kill switch is removed in a separate review"
          echo "Build with publish=false to produce candidate evidence for release review."
          exit 1
      - name: Require main and lock the artifact revision
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Immutable artifacts may only be built from main"
            exit 1
          fi
          if [[ ! "$INPUT_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::revision must be a positive integer"
            exit 1
          fi
          if [ "$INPUT_REVISION" -lt 2 ]; then
            echo "::error::r1 is the immutable historical schema-v2 baseline; all new candidates require r2 or later and schema v3"
            exit 1
          fi
          ARTIFACT_TAG="artifacts-sdk-0.17.0-r$INPUT_REVISION"
          echo "ARTIFACT_TAG=$ARTIFACT_TAG" >> "$GITHUB_ENV"
          MAX_ARTIFACT_REVISION="$(git ls-remote --tags --refs origin \
            'refs/tags/artifacts-sdk-0.17.0-r*' | awk '
              $2 ~ /^refs\/tags\/artifacts-sdk-0\.17\.0-r[1-9][0-9]*$/ {
                value = $2
                sub(/^refs\/tags\/artifacts-sdk-0\.17\.0-r/, "", value)
                if ((value + 0) > maximum) maximum = value + 0
              }
              END { print maximum + 0 }
            ')"
          REMOTE_REFS="$(git ls-remote --tags origin \
            "refs/tags/$ARTIFACT_TAG" "refs/tags/$ARTIFACT_TAG^{}")"
          TAG_TARGET="$(printf '%s\n' "$REMOTE_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$TAG_TARGET" ]; then
            TAG_TARGET="$(printf '%s\n' "$REMOTE_REFS" | awk 'NF == 2 { print $1; exit }')"
          fi
          RELEASE_EXISTS=false
          if gh release view "$ARTIFACT_TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          if [ -z "$TAG_TARGET" ] && [ "$RELEASE_EXISTS" != true ] && \
             [ "$INPUT_REVISION" -le "$MAX_ARTIFACT_REVISION" ]; then
            echo "::error::New artifact revision r$INPUT_REVISION must be greater than published r$MAX_ARTIFACT_REVISION"
            exit 1
          fi

          if [ "$INPUT_PUBLISH" != "true" ]; then
            if [ -n "$TAG_TARGET" ] || [ "$RELEASE_EXISTS" = true ]; then
              echo "::error::$ARTIFACT_TAG is already published and cannot be reused for candidate evidence"
              exit 1
            fi
            echo "ARTIFACT_RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          elif [ -n "$TAG_TARGET" ] || [ "$RELEASE_EXISTS" = true ]; then
            if [ -z "$TAG_TARGET" ] || [ "$RELEASE_EXISTS" != true ]; then
              echo "::error::$ARTIFACT_TAG is in a partial tag/release state; refusing automatic recovery"
              exit 1
            fi
            RELEASE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ARTIFACT_TAG" \
              --jq '[.draft, .prerelease, .immutable, .target_commitish] | @tsv')"
            IFS=$'\t' read -r IS_DRAFT IS_PRERELEASE IS_IMMUTABLE RELEASE_TARGET <<< "$RELEASE_STATE"
            if [ "$TAG_TARGET" != "$GITHUB_SHA" ] || \
               [ "$RELEASE_TARGET" != "$GITHUB_SHA" ] || \
               [ "$IS_DRAFT" != false ] || \
               [ "$IS_PRERELEASE" != false ] || \
               [ "$IS_IMMUTABLE" != true ]; then
              echo "::error::Existing $ARTIFACT_TAG is not the exact immutable release for $GITHUB_SHA"
              echo "tag=$TAG_TARGET release=$RELEASE_TARGET draft=$IS_DRAFT prerelease=$IS_PRERELEASE immutable=$IS_IMMUTABLE"
              exit 1
            fi
            echo "ARTIFACT_RELEASE_EXISTS=true" >> "$GITHUB_ENV"
            echo "Resuming verification of existing immutable release $ARTIFACT_TAG"
          else
            echo "ARTIFACT_RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Reproduce portable worker twice
        run: |
          tools/runtime/test-bundle-reproducibility.sh
          cmp tools/runtime/.build/worker.repro-a.bundle \
            Sources/QVACClient/Resources/worker.mobile.bundle
      - name: Build the native dependency closure
        run: |
          tools/native/bare-kit/build-candidate.sh
          QVAC_BARE_KIT_CANDIDATE="$GITHUB_WORKSPACE/tools/native/bare-kit/.build/BareKit.xcframework" \
            tools/runtime/link-ios-artifacts.sh
          node tools/release/compute-manifest.mjs link-set \
            tools/runtime/.build/artifacts \
            tools/runtime/.build/worker.repro-a.bundle \
            tools/runtime/.build/link-set.json
      - name: Install checksum-pinned XcodeGen
        run: |
          XCODEGEN_VERSION=2.46.0
          XCODEGEN_SHA256=4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          XCODEGEN_ARCHIVE="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          XCODEGEN_ROOT="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$XCODEGEN_ARCHIVE"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$XCODEGEN_ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$XCODEGEN_ROOT"
          ditto -x -k "$XCODEGEN_ARCHIVE" "$XCODEGEN_ROOT"
          QVAC_XCODEGEN="$XCODEGEN_ROOT/xcodegen/bin/xcodegen"
          test -x "$QVAC_XCODEGEN"
          test "$("$QVAC_XCODEGEN" --version)" = "Version: $XCODEGEN_VERSION"
          echo "QVAC_XCODEGEN=$QVAC_XCODEGEN" >> "$GITHUB_ENV"
      - name: Install the pinned iOS test runtime
        timeout-minutes: 40
        run: |
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 16.4'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 16F6'
          if ! xcrun simctl list -j runtimes | jq -e --arg id "$QVAC_IOS_RUNTIME_ID" \
            'any(.runtimes[]; .identifier == $id and .isAvailable == true)' >/dev/null; then
            for ATTEMPT in 1 2; do
              if xcodebuild -downloadPlatform iOS -buildVersion "$QVAC_IOS_RUNTIME_VERSION"; then
                break
              fi
              if [ "$ATTEMPT" = 2 ]; then
                echo "::error::Could not install iOS $QVAC_IOS_RUNTIME_VERSION Simulator runtime"
                exit 1
              fi
            done
          fi
          xcrun simctl list -j runtimes | jq -e --arg id "$QVAC_IOS_RUNTIME_ID" \
            'any(.runtimes[]; .identifier == $id and .isAvailable == true)' >/dev/null
      - name: Create and boot the artifact-candidate simulator
        run: |
          xcrun simctl list -j devicetypes | jq -e --arg id "$QVAC_IOS_DEVICE_TYPE_ID" \
            'any(.devicetypes[]; .identifier == $id)' >/dev/null
          UDID="$(xcrun simctl create \
            "qvac-artifact-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$QVAC_IOS_DEVICE_TYPE_ID" \
            "$QVAC_IOS_RUNTIME_ID")"
          echo "QVAC_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Validate the patched candidate through the consuming package
        run: |
          cp Package.swift "$RUNNER_TEMP/Package.swift.canonical"
          restore_package_manifest() {
            cp "$RUNNER_TEMP/Package.swift.canonical" Package.swift
          }
          trap restore_package_manifest EXIT
          node tools/ci/package-manifest-mode.mjs --activate-development
          swift package dump-package >/dev/null

          xcodebuild -scheme QVACClient \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/qvac-candidate-device-dd" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            OTHER_SWIFT_FLAGS='-strict-concurrency=complete' \
            build 2>&1 | tee "$RUNNER_TEMP/qvac-candidate-device.log"

          tools/coverage/run-ios-transport.sh --self-test
          (
            cd Tests/QVACiOSSmokeHarness
            xcodebuild -scheme QVACiOSSmokeHarness-Package \
              -destination "platform=iOS Simulator,id=$QVAC_SIMULATOR_UDID" \
              -destination-timeout 180 \
              -derivedDataPath "$RUNNER_TEMP/qvac-candidate-ios-dd" \
              CODE_SIGNING_ALLOWED=NO \
              -parallel-testing-enabled NO \
              -enableCodeCoverage YES \
              SWIFT_SUPPRESS_WARNINGS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              OTHER_SWIFT_FLAGS='-strict-concurrency=complete -profile-generate -profile-coverage-mapping' \
              -resultBundlePath "$RUNNER_TEMP/qvac-candidate-ios.xcresult" \
              -only-testing:QVACiOSSmokeTests \
              test
          ) 2>&1 | tee "$RUNNER_TEMP/qvac-candidate-ios.log"
          tools/coverage/run-ios-transport.sh \
            --native-read-adapter checked \
            "$RUNNER_TEMP/qvac-candidate-ios-dd" \
            "$RUNNER_TEMP/qvac-candidate-ios.log" \
            "$RUNNER_TEMP/qvac-candidate-ios-coverage"

          (
            cd Examples/QVACChat
            "$QVAC_XCODEGEN" generate
            xcodebuild -project QVACChat.xcodeproj -scheme QVACChat-iOS \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/qvac-candidate-example-dd" \
              SWIFT_SUPPRESS_WARNINGS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              OTHER_SWIFT_FLAGS='-strict-concurrency=complete' \
              build
          ) 2>&1 | tee "$RUNNER_TEMP/qvac-candidate-example.log"

          restore_package_manifest
          trap - EXIT
          git diff --exit-code -- Package.swift
      - name: Tear down the artifact-candidate simulator
        if: always()
        run: |
          if [ -n "${QVAC_SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$QVAC_SIMULATOR_UDID" || true
            xcrun simctl delete "$QVAC_SIMULATOR_UDID" || true
          fi
      - name: Upload patched-candidate validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-kit-candidate-validation-${{ github.sha }}
          path: |
            tools/native/bare-kit/.build/BareKit.xcframework
            tools/native/bare-kit/.build/bare-kit-native-closure.json
            tools/native/bare-kit/bare-kit-2.3.0-qvac.patch
            tools/native/bare-kit/provenance.lock.json
            ${{ runner.temp }}/qvac-candidate-device.log
            ${{ runner.temp }}/qvac-candidate-ios.log
            ${{ runner.temp }}/qvac-candidate-ios.xcresult
            ${{ runner.temp }}/qvac-candidate-ios-coverage
            ${{ runner.temp }}/qvac-candidate-example.log
          if-no-files-found: error
          retention-days: 30
      - name: Verify third-party notices
        run: node tools/release/generate-third-party-notices.mjs --check
      - name: Package artifacts and evidence
        run: |
          tools/runtime/test-path-safety.sh
          node tools/release/test-archive-reproducibility.mjs
          node tools/release/package-artifacts.mjs \
            tools/runtime/.build/artifacts \
            tools/runtime/.build/link-set.json \
            tools/runtime/.build/worker.repro-a.bundle \
            tools/runtime/.build/release-assets
          node tools/release/compute-manifest.mjs release \
            tools/runtime/.build/link-set.json \
            tools/runtime/.build/worker.repro-a.bundle \
            tools/runtime/.build/release-assets \
            tools/runtime/.build/release-assets/artifact-manifest.json \
            --artifact-tag "$ARTIFACT_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA"
          node tools/release/verify-release.mjs \
            tools/runtime/.build/release-assets/artifact-manifest.json \
            --require-schema 3 \
            --privacy-audit tools/release/privacy-manifest-audit.json \
            --assets-dir tools/runtime/.build/release-assets
      - name: Verify publication prerequisites
        if: inputs.publish
        run: |
          node tools/release/generate-third-party-notices.mjs --check-publication
          node tools/release/verify-privacy-manifests.mjs --check-publication \
            --frameworks tools/runtime/.build/artifacts \
            --link-set tools/runtime/.build/link-set.json \
            --assets-dir tools/runtime/.build/release-assets
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          if [ "${{ inputs.license_reviewed }}" != "true" ]; then
            echo "::error::Binary publication requires maintainer/legal review of THIRD_PARTY_NOTICES.md, including pinned supplements, and license_reviewed=true"
            exit 1
          fi
      - name: Verify CI for the publication commit
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN_ID="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(
              .conclusion == "success" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == env.GITHUB_SHA
            )][0].id // empty')"
          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::No successful full CI push run exists for artifact source $GITHUB_SHA"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" \
            --jq '"Artifact publication authorized by CI run \(.html_url): sha=\(.head_sha) conclusion=\(.conclusion)"'
      - name: Verify the URL package manifest
        if: inputs.publish
        run: |
          node tools/release/verify-release.mjs \
            tools/runtime/.build/release-assets/artifact-manifest.json \
            --require-schema 3 \
            --source-commit "$GITHUB_SHA" \
            --assets-dir tools/runtime/.build/release-assets \
            --package Package.swift \
            --bundle Sources/QVACClient/Resources/worker.mobile.bundle \
            --privacy-audit tools/release/privacy-manifest-audit.json
          echo "Final publication gate: canonical Package.swift is URL-based and bound to $GITHUB_SHA"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_TAG }}
          path: tools/runtime/.build/release-assets/
          if-no-files-found: error
      - name: Publish new artifact release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ARTIFACT_RELEASE_EXISTS" != true ]; then
            CURRENT_MAX_REVISION="$(git ls-remote --tags --refs origin \
              'refs/tags/artifacts-sdk-0.17.0-r*' | awk '
                $2 ~ /^refs\/tags\/artifacts-sdk-0\.17\.0-r[1-9][0-9]*$/ {
                  value = $2
                  sub(/^refs\/tags\/artifacts-sdk-0\.17\.0-r/, "", value)
                  if ((value + 0) > maximum) maximum = value + 0
                }
                END { print maximum + 0 }
              ')"
            REQUESTED_REVISION="${ARTIFACT_TAG##*-r}"
            if [ "$REQUESTED_REVISION" -le "$CURRENT_MAX_REVISION" ] || \
               gh release view "$ARTIFACT_TAG" >/dev/null 2>&1; then
              echo "::error::Artifact publication state changed during verification; choose a new revision"
              echo "requested=r$REQUESTED_REVISION current-max=r$CURRENT_MAX_REVISION"
              exit 1
            fi
            REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk 'NF == 2 { print $1; exit }')"
            if [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
              echo "::error::main advanced during artifact verification; dispatch a new unused revision from the current commit"
              echo "artifact-source=$GITHUB_SHA remote-main=$REMOTE_MAIN"
              exit 1
            fi
            gh release create "$ARTIFACT_TAG" tools/runtime/.build/release-assets/* \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "QVAC SDK 0.17.0 binary artifacts (${ARTIFACT_TAG##*-})" \
              --notes "Binary dependencies for QVACClient. This release contains the iOS XCFrameworks and worker bundle referenced by Package.swift. It also includes checksums, third-party notices, privacy-audit results, and provenance records. Most users should install the source package rather than download these files directly."
          fi

          # With repository release immutability enabled, current gh creates a
          # draft, uploads every supplied asset, and only then publishes it.
          # Re-run the complete audit so a transient post-publication failure can
          # be resumed without replacing a tag or any immutable asset.
          verify_published_artifact() {
            gh release verify "$ARTIFACT_TAG" >/dev/null || return 1
            for ASSET in tools/runtime/.build/release-assets/*; do
              gh release verify-asset "$ARTIFACT_TAG" "$ASSET" >/dev/null || return 1
            done

            MANIFEST_SOURCE="$(node -p 'require("./tools/runtime/.build/release-assets/artifact-manifest.json").sourceCommit')" || return 1
            REMOTE_REFS="$(git ls-remote --tags origin "refs/tags/$ARTIFACT_TAG" "refs/tags/$ARTIFACT_TAG^{}")" || return 1
            TAG_TARGET="$(printf '%s\n' "$REMOTE_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [ -z "$TAG_TARGET" ]; then
              TAG_TARGET="$(printf '%s\n' "$REMOTE_REFS" | awk 'NF == 2 { print $1; exit }')"
            fi
            RELEASE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ARTIFACT_TAG" \
              --jq '[.draft, .prerelease, .immutable, .target_commitish] | @tsv')" || return 1
            IFS=$'\t' read -r IS_DRAFT IS_PRERELEASE IS_IMMUTABLE RELEASE_TARGET <<< "$RELEASE_STATE"
            if [ "$MANIFEST_SOURCE" != "$GITHUB_SHA" ] || \
               [ "$TAG_TARGET" != "$MANIFEST_SOURCE" ] || \
               [ "$RELEASE_TARGET" != "$MANIFEST_SOURCE" ] || \
               [ "$IS_DRAFT" != false ] || \
               [ "$IS_PRERELEASE" != false ] || \
               [ "$IS_IMMUTABLE" != true ]; then
              echo "manifest=$MANIFEST_SOURCE tag=$TAG_TARGET release=$RELEASE_TARGET draft=$IS_DRAFT prerelease=$IS_PRERELEASE immutable=$IS_IMMUTABLE"
              return 1
            fi
          }

          PUBLICATION_VERIFIED=false
          for ATTEMPT in {1..12}; do
            if verify_published_artifact; then
              PUBLICATION_VERIFIED=true
              break
            fi
            if [ "$ATTEMPT" -lt 12 ]; then
              sleep 5
            fi
          done
          if [ "$PUBLICATION_VERIFIED" != true ]; then
            echo "::error::Could not verify the complete immutable $ARTIFACT_TAG publication within 60 seconds; rerun this same workflow run to resume its non-mutating audit"
            exit 1
          fi
          echo "Verified immutable release, attestation, tag/source binding, and every asset for $ARTIFACT_TAG"
