name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QVAC_NODE_VERSION: 22.22.0

jobs:
  codegen:
    name: Pinned contract, codegen freshness, and <30s generation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/codegen/package-lock.json
      - name: Bootstrap exact source and npm inputs
        run: tools/codegen/bootstrap.sh
      - name: Generate from immutable contract and enforce KR-3
        run: |
          SECONDS=0
          tools/codegen/run.sh --generate-only
          ELAPSED=$SECONDS
          echo "Pinned generation time: ${ELAPSED}s"
          if [ "$ELAPSED" -ge 30 ]; then
            echo "::error::Code generation took ${ELAPSED}s; grant limit is <30s after bootstrap"
            exit 1
          fi
      - name: Verify generated sources and tests are fresh
        run: |
          CHANGES="$(git status --porcelain -- \
            Sources/QVACClient/Generated \
            'Tests/QVACClientUnitTests/*.generated.swift')"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            git diff -- Sources/QVACClient/Generated \
              'Tests/QVACClientUnitTests/*.generated.swift'
            exit 1
          fi
          git diff --check
      - name: Bootstrap safety regression
        run: tools/codegen/test-bootstrap-safety.sh

  runtime-artifact:
    name: Exact 0.17 portable worker reproducibility
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Build twice from distinct roots
        run: tools/runtime/test-bundle-reproducibility.sh
      - name: Require committed worker to be the reproduced artifact
        run: |
          cmp tools/runtime/.build/worker.repro-a.bundle \
            Sources/QVACClient/Resources/worker.mobile.bundle
          node tools/release/verify-bundle-provenance.mjs \
            Sources/QVACClient/Resources/worker.mobile.bundle
          node tools/release/generate-third-party-notices.mjs --check
      - name: Destructive path and archive determinism regressions
        run: |
          tools/runtime/test-path-safety.sh
          node tools/release/test-archive-reproducibility.mjs
          node tools/release/test-release-source-binding.mjs
          tools/ci/run-required-suite.sh --self-test
          node tools/ci/package-manifest-mode.mjs --self-test
          node tools/release/generate-third-party-notices.mjs --self-test

  unit:
    name: Unit tests · macOS arm64
    runs-on: macos-14
    needs: [codegen]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Materialize exact local development binary graph
        run: tools/runtime/link-ios-artifacts.sh
      - name: Verify exact development manifest freshness
        run: |
          node tools/release/compute-manifest.mjs development \
            tools/runtime/.build/artifacts \
            Sources/QVACClient/Resources/worker.mobile.bundle \
            "$RUNNER_TEMP/artifacts.development.json"
          cmp "$RUNNER_TEMP/artifacts.development.json" \
            tools/release/artifacts.development.json
          node tools/release/generate-package-manifest.mjs \
            "$RUNNER_TEMP/artifacts.development.json" "$RUNNER_TEMP/Package.swift"
          cmp "$RUNNER_TEMP/Package.swift" Package.swift.dev
          node tools/ci/package-manifest-mode.mjs --activate-development
      - name: Build and test
        run: |
          swift package dump-package >/dev/null
          swift build -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
          swift test \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete \
            --filter QVACClientUnitTests

  documentation:
    name: DocC · warnings are errors
    runs-on: macos-14
    needs: [unit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Materialize exact local development binary graph
        run: |
          tools/runtime/link-ios-artifacts.sh
          node tools/ci/package-manifest-mode.mjs --activate-development
      - name: Build DocC from the package manifest
        run: |
          swift package dump-package >/dev/null
          xcodebuild docbuild -scheme QVACClient \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/qvac-docc-dd" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            OTHER_SWIFT_FLAGS='-strict-concurrency=complete' \
            OTHER_DOCC_FLAGS='--warnings-as-errors'

  integration-live:
    name: Live worker · all no-model RPC suites
    runs-on: macos-14
    needs: [unit, runtime-artifact]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Install exact runtime and local binary graph
        run: |
          tools/runtime/link-ios-artifacts.sh
          node tools/ci/package-manifest-mode.mjs --activate-development
      - name: Run required live suites with zero skips
        env:
          QVAC_BARE_BIN: ${{ github.workspace }}/tools/runtime/node_modules/bare-runtime/bin/bare
          QVAC_NODE_MODULES: ${{ github.workspace }}/tools/runtime/node_modules
          QVAC_WORKER_SCRIPT: ${{ github.workspace }}/tools/runtime/node_modules/@qvac/sdk/dist/server/worker.js
        run: |
          tools/ci/run-required-suite.sh QVACClientIntegrationTests 5
          tools/ci/run-required-suite.sh LiveWorkerIntegrationTests 5
          tools/ci/run-required-suite.sh AllRPCTypesRoundTripTests 1

  integration-models:
    name: First inference <10m; pinned LLM, RAG, and upscale · zero skips
    runs-on: macos-14
    needs: [unit, runtime-artifact]
    timeout-minutes: 60
    steps:
      - name: Start clean-checkout-to-first-inference budget
        run: date +%s > "$RUNNER_TEMP/qvac-first-inference-start"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Install exact runtime and local binary graph
        run: |
          tools/runtime/link-ios-artifacts.sh
          node tools/ci/package-manifest-mode.mjs --activate-development
      - name: Prove clean checkout through first real inference in under 10 minutes
        env:
          QVAC_BARE_BIN: ${{ github.workspace }}/tools/runtime/node_modules/bare-runtime/bin/bare
          QVAC_NODE_MODULES: ${{ github.workspace }}/tools/runtime/node_modules
          QVAC_MODEL_FIXTURE_CACHE: ${{ runner.temp }}/qvac-model-fixtures
          QVAC_RUN_REAL_MODEL_TESTS: "1"
          QVAC_RUN_RAG_TESTS: "1"
          QVAC_RUN_UPSCALE_TESTS: "1"
        run: |
          START="$(cat "$RUNNER_TEMP/qvac-first-inference-start")"
          ELAPSED="$(( $(date +%s) - START ))"
          REMAINING="$(( 600 - ELAPSED ))"
          if [ "$REMAINING" -le 0 ]; then
            echo "::error::Setup exhausted the 600s clone/setup-to-first-inference budget"
            exit 1
          fi
          set +e
          perl -e 'alarm shift; exec @ARGV or die "exec failed: $!\n"' \
            "$REMAINING" tools/ci/run-required-suite.sh RealModelIntegrationTests 3
          STATUS="$?"
          set -e
          if [ "$STATUS" -eq 142 ]; then
            echo "::error::First-inference gate exceeded 600s from clean checkout"
            exit 1
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          TOTAL="$(( $(date +%s) - START ))"
          echo "Clean checkout/setup through pinned real-model inference: ${TOTAL}s"
          if [ "$TOTAL" -ge 600 ]; then
            echo "::error::First inference took ${TOTAL}s; grant limit is <600s"
            exit 1
          fi
      - name: Run remaining checksum-pinned model suites
        env:
          QVAC_BARE_BIN: ${{ github.workspace }}/tools/runtime/node_modules/bare-runtime/bin/bare
          QVAC_NODE_MODULES: ${{ github.workspace }}/tools/runtime/node_modules
          QVAC_MODEL_FIXTURE_CACHE: ${{ runner.temp }}/qvac-model-fixtures
          QVAC_RUN_RAG_TESTS: "1"
          QVAC_RUN_UPSCALE_TESTS: "1"
        run: |
          tools/ci/run-required-suite.sh RAGIntegrationTests 2
          tools/ci/run-required-suite.sh UpscaleIntegrationTests 1

  ios-and-example:
    name: iOS package and example builds
    runs-on: macos-15
    needs: [unit, runtime-artifact]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Materialize exact 0.17 iOS graph
        run: |
          tools/runtime/link-ios-artifacts.sh
          node tools/ci/package-manifest-mode.mjs --activate-development
      - name: Build clean-checkout package for iOS device and Simulator
        run: |
          swift package dump-package >/dev/null
          git diff --exit-code -- Sources Tests
          xcodebuild -scheme QVACClient \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/qvac-package-device-dd" \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme QVACClient \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/qvac-package-dd" build
      - name: Run external-package smoke test on a hosted iOS Simulator
        working-directory: Tests/QVACiOSSmokeHarness
        run: |
          swift package dump-package >/dev/null
          xcodebuild -scheme QVACiOSSmokeHarness-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/qvac-ios-smoke-dd" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:QVACiOSSmokeTests test
      - name: Build QVACChat on iOS and macOS
        run: |
          brew install xcodegen
          cd Examples/QVACChat
          xcodegen generate
          xcodebuild -project QVACChat.xcodeproj -scheme QVACChat-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/qvac-chat-ios-dd" build
          xcodebuild -project QVACChat.xcodeproj -scheme QVACChat-macOS \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/qvac-chat-macos-dd" build

  benchmark:
    name: KR-2 public API benchmark · exact 5% gate
    runs-on: macos-14
    needs: [unit, runtime-artifact]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.QVAC_NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Materialize exact local binary graph
        run: |
          tools/runtime/link-ios-artifacts.sh
          node tools/ci/package-manifest-mode.mjs --activate-development
      - name: Verify statistical analyzer and equal timeout-policy guard
        run: node bench/test-analyzer.mjs
      - name: Run ABBA benchmark with noise-aware 5% decision
        run: bench/run.sh 1000
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-evidence
          path: bench/result.json
          if-no-files-found: error
