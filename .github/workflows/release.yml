name: Release

# Fires on tag pushes matching `v*` (e.g. v0.1.0, v0.2.0-rc.1).
# Validates the package, generates iOS bundle/xcframeworks, creates a GitHub Release
# with the artifacts uploaded as binaryTarget-consumable zips.

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug, macOS arm64)
        run: swift build
      - name: Test (unit only — keeps CI fast)
        run: swift test --filter QVACClientUnitTests
      # Codegen freshness is enforced on every push by .github/workflows/ci.yml; we
      # don't repeat it here so the release flow doesn't have to install spike-js.

  generate-ios-artifacts:
    name: Generate iOS worker bundle + addon xcframeworks
    runs-on: macos-14
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install @qvac/sdk + addons + bare deps
        # Match the integration jobs' install list so bare-pack / bare-link see all
        # the transitive bare-* / hyper* packages they need to resolve.
        run: |
          mkdir -p spike-js && cd spike-js
          npm init -y >/dev/null
          npm install --legacy-peer-deps \
            @qvac/sdk @qvac/cli \
            @qvac/llm-llamacpp @qvac/embed-llamacpp \
            @qvac/transcription-whispercpp @qvac/transcription-parakeet \
            @qvac/translation-nmtcpp @qvac/tts-onnx \
            @qvac/ocr-onnx @qvac/diffusion-cpp \
            tar-stream hyperdrive hyperdb hyperswarm corestore pear-pipe llm-splitter \
            bare-net bare-rpc bare-buffer bare-fs bare-os bare-path bare-process \
            bare-stream bare-abort-controller bare-crypto bare-dns bare-fetch \
            bare-http1 bare-https bare-link bare-runtime bare-subprocess bare-zlib \
            bare-pack \
            compact-encoding events fast-safe-stringify which-runtime \
            @modelcontextprotocol/sdk
      - name: Regenerate worker.mobile.bundle.js (best effort)
        # Drops --quiet so bare-pack's stderr is visible. The committed
        # Sources/QVACClient/Resources/worker.mobile.bundle.js is the source of
        # truth; if regen succeeds we update it, if it fails we keep the committed
        # bundle (continue-on-error: true). For a real consumer-facing release we
        # want regen to succeed — this step's failure is a soft warning until then.
        continue-on-error: true
        run: |
          cd spike-js
          node node_modules/@qvac/cli/dist/index.js bundle sdk \
            --host ios-arm64 \
            --host ios-arm64-simulator \
            --host ios-x64-simulator \
            --defer expo-file-system --defer react-native-bare-kit
          if [ -f qvac/worker.bundle.js ]; then
              cp qvac/worker.bundle.js ../Sources/QVACClient/Resources/worker.mobile.bundle.js
              echo "[release] regenerated worker.mobile.bundle.js"
          else
              echo "::warning::bundle regen produced no qvac/worker.bundle.js — using committed bundle"
          fi
      - name: Run bare-link to produce iOS xcframeworks
        run: |
          mkdir -p artifacts
          cd spike-js
          node -e "
            const link = require('bare-link');
            (async () => {
              for await (const r of link('.', { hosts: ['ios-arm64', 'ios-arm64-simulator', 'ios-x64-simulator'], out: '../artifacts' })) {
                if (r.endsWith('.xcframework')) console.log(r);
              }
            })();
          "
      - name: Package + checksum each xcframework
        run: |
          mkdir -p release-assets
          cd artifacts
          for fw in *.xcframework; do
              zip -r -q "../release-assets/${fw}.zip" "$fw"
              shasum -a 256 "../release-assets/${fw}.zip" > "../release-assets/${fw}.zip.sha256"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/

  create-release:
    name: Create GitHub Release
    runs-on: macos-14
    needs: [generate-ios-artifacts]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Notify Swift Package Index
        # SPI auto-detects new tags within a few minutes; this is a courtesy ping.
        run: |
          curl -sf "https://swiftpackageindex.com/api/packages/${GITHUB_REPOSITORY,,}/refresh" || true

      - name: Verify Package.swift is consumer-mode for a tagged release
        # Tagged releases must use binaryTarget(url:checksum:) so external SPM
        # consumers (`.package(url:, from:)`) can resolve. If the tagged commit
        # still has dev-mode local paths, surface a clear warning here so the
        # maintainer remembers to run tools/release/prepare-release.sh and move
        # the tag. We don't fail the workflow — the artifacts upload is still
        # useful — but we make the regression visible.
        run: |
          if grep -q 'path: "spike-swift/Vendor/BareKit.xcframework"' Package.swift; then
            echo "::warning::Package.swift at this tag is in DEV MODE (path-based BareKit). SPM consumers using \`.package(url:, from:)\` cannot resolve. Run tools/release/prepare-release.sh ${GITHUB_REF_NAME} locally, commit, and re-tag."
          else
            echo "Package.swift looks consumer-ready (URL-based binaryTargets)."
          fi
