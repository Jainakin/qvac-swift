name: Source Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New source SemVer without the v prefix (first stable release: 0.1.0)'
        required: true
        type: string
      artifact_tag:
        description: Published immutable artifact tag built from this exact commit
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - name: Resolve and lock the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Source releases may only be dispatched from main"
            exit 1
          fi
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a SemVer without the v prefix"
            exit 1
          fi
          if [[ ! "$INPUT_ARTIFACT_TAG" =~ ^artifacts-sdk-0\.17\.0-r[1-9][0-9]*$ ]]; then
            echo "::error::artifact_tag must be artifacts-sdk-0.17.0-rN"
            exit 1
          fi
          VERSION_TAG="v$INPUT_VERSION"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "ARTIFACT_TAG=$INPUT_ARTIFACT_TAG" >> "$GITHUB_ENV"
          gh release verify --help >/dev/null

          CHECKED_OUT="$(git rev-parse HEAD)"
          EVENT_COMMIT="$(git rev-parse "$GITHUB_SHA^{commit}")"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk 'NF == 2 { print $1; exit }')"
          if [ "$CHECKED_OUT" != "$EVENT_COMMIT" ]; then
            echo "::error::Checked-out commit and GITHUB_SHA must be identical"
            echo "checkout=$CHECKED_OUT event=$EVENT_COMMIT"
            exit 1
          fi

          ARTIFACT_REFS="$(git ls-remote --tags origin \
            "refs/tags/$INPUT_ARTIFACT_TAG" "refs/tags/$INPUT_ARTIFACT_TAG^{}")"
          ARTIFACT_COMMIT="$(printf '%s\n' "$ARTIFACT_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$ARTIFACT_COMMIT" ]; then
            ARTIFACT_COMMIT="$(printf '%s\n' "$ARTIFACT_REFS" | awk 'NF == 2 { print $1; exit }')"
          fi
          if [ "$ARTIFACT_COMMIT" != "$EVENT_COMMIT" ]; then
            echo "::error::Artifact tag must resolve to the exact source release commit"
            echo "artifact=$ARTIFACT_COMMIT release=$EVENT_COMMIT"
            exit 1
          fi
          if ! gh release view "$INPUT_ARTIFACT_TAG" >/dev/null 2>&1; then
            echo "::error::Immutable artifact release $INPUT_ARTIFACT_TAG does not exist"
            exit 1
          fi
          SOURCE_REFS="$(git ls-remote --tags origin \
            "refs/tags/$VERSION_TAG" "refs/tags/$VERSION_TAG^{}")"
          SOURCE_COMMIT="$(printf '%s\n' "$SOURCE_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$SOURCE_COMMIT" ]; then
            SOURCE_COMMIT="$(printf '%s\n' "$SOURCE_REFS" | awk 'NF == 2 { print $1; exit }')"
          fi
          if [ -n "$SOURCE_COMMIT" ] && [ "$SOURCE_COMMIT" != "$EVENT_COMMIT" ]; then
            echo "::error::Existing $VERSION_TAG points at a different commit and must never be moved"
            exit 1
          fi
          SOURCE_TAG_EXISTS=false
          if [ -n "$SOURCE_COMMIT" ]; then
            SOURCE_TAG_EXISTS=true
          fi

          SOURCE_RELEASE_EXISTS=false
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            if [ -z "$SOURCE_COMMIT" ]; then
              echo "::error::Source release $VERSION_TAG exists without a resolvable Git tag"
              exit 1
            fi
            RELEASE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG" \
              --jq '[.draft, .prerelease, .immutable] | @tsv')"
            IFS=$'\t' read -r IS_DRAFT IS_PRERELEASE IS_IMMUTABLE <<< "$RELEASE_STATE"
            if [ "$IS_DRAFT" != false ] || \
               [ "$IS_PRERELEASE" != false ] || \
               [ "$IS_IMMUTABLE" != true ]; then
              echo "::error::Existing $VERSION_TAG is not a published immutable source release"
              echo "draft=$IS_DRAFT prerelease=$IS_PRERELEASE immutable=$IS_IMMUTABLE"
              exit 1
            fi
            SOURCE_RELEASE_EXISTS=true
            echo "Resuming verification of existing immutable source release $VERSION_TAG"
          fi
          if [ "$REMOTE_MAIN" != "$EVENT_COMMIT" ] && [ "$SOURCE_TAG_EXISTS" != true ]; then
            echo "::error::Current remote main must equal the release commit before the source tag is created"
            echo "release=$EVENT_COMMIT remote-main=$REMOTE_MAIN"
            exit 1
          fi
          echo "SOURCE_TAG_EXISTS=$SOURCE_TAG_EXISTS" >> "$GITHUB_ENV"
          echo "SOURCE_RELEASE_EXISTS=$SOURCE_RELEASE_EXISTS" >> "$GITHUB_ENV"
      - name: Require the complete CI workflow to have passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN_ID="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(
              .conclusion == "success" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == env.GITHUB_SHA
            )][0].id // empty')"
          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::No successful CI push run exists for exact release commit $GITHUB_SHA"
            echo "Run .github/workflows/ci.yml to completion on this main commit before releasing."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" \
            --jq '"Verified CI run \(.html_url): sha=\(.head_sha) conclusion=\(.conclusion)"'
      - name: Download the immutable artifact manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release verify "$ARTIFACT_TAG"
          MANIFEST_DIR="$RUNNER_TEMP/qvac-source-release"
          mkdir -p "$MANIFEST_DIR"
          gh release download "$ARTIFACT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern artifact-manifest.json \
            --dir "$MANIFEST_DIR"
          MANIFEST="$MANIFEST_DIR/artifact-manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$ARTIFACT_TAG has no artifact-manifest.json"
            exit 1
          fi
          echo "RELEASE_ARTIFACT_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
      - name: Bind source, URL manifest, and every remote artifact byte
        run: |
          node tools/release/verify-release.mjs \
            "$RELEASE_ARTIFACT_MANIFEST" \
            --source-commit "$GITHUB_SHA" \
            --package Package.swift \
            --bundle Sources/QVACClient/Resources/worker.mobile.bundle \
            --remote
          swift package dump-package >/dev/null
      - name: Prove clean Git-URL consumer resolution before creating a tag
        run: |
          tools/ci/test-external-consumer.sh \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            --revision "$GITHUB_SHA"
      - name: Unit tests through the verified URL manifest
        run: swift test --filter QVACClientUnitTests
      - name: Create the immutable source tag and release only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk 'NF == 2 { print $1; exit }')"
          if [ "$SOURCE_TAG_EXISTS" != true ] && [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced during verification; dispatch again from the new commit"
            exit 1
          fi
          if [ "$SOURCE_RELEASE_EXISTS" != true ] && \
             gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "::error::Source release $VERSION_TAG appeared during verification"
            exit 1
          fi

          SOURCE_REFS="$(git ls-remote --tags origin \
            "refs/tags/$VERSION_TAG" "refs/tags/$VERSION_TAG^{}")"
          SOURCE_COMMIT="$(printf '%s\n' "$SOURCE_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$SOURCE_COMMIT" ]; then
            SOURCE_COMMIT="$(printf '%s\n' "$SOURCE_REFS" | awk 'NF == 2 { print $1; exit }')"
          fi
          if [ -n "$SOURCE_COMMIT" ] && [ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION_TAG appeared at a different commit; refusing to replace it"
            exit 1
          fi
          if [ -z "$SOURCE_COMMIT" ]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag -a "$VERSION_TAG" "$GITHUB_SHA" -m "QVACClient $VERSION_TAG"
            git push origin "refs/tags/$VERSION_TAG"
          fi

          REMOTE_REFS="$(git ls-remote --tags origin \
            "refs/tags/$VERSION_TAG" "refs/tags/$VERSION_TAG^{}")"
          REMOTE_COMMIT="$(printf '%s\n' "$REMOTE_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$REMOTE_COMMIT" ]; then
            REMOTE_COMMIT="$(printf '%s\n' "$REMOTE_REFS" | awk 'NF == 2 { print $1; exit }')"
          fi
          if [ "$REMOTE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Published source tag does not resolve to the verified commit"
            exit 1
          fi
          if [ "$SOURCE_RELEASE_EXISTS" != true ]; then
            RELEASE_NOTES="Production SwiftPM release for exact @qvac/sdk 0.17.0. Immutable binary artifacts and provenance: https://github.com/$GITHUB_REPOSITORY/releases/tag/$ARTIFACT_TAG"
            gh release create "$VERSION_TAG" \
              --verify-tag \
              --latest \
              --title "QVACClient $VERSION_TAG" \
              --notes "$RELEASE_NOTES" \
              --generate-notes
          fi

          verify_published_source() {
            gh release verify "$VERSION_TAG" >/dev/null || return 1
            REMOTE_REFS="$(git ls-remote --tags origin \
              "refs/tags/$VERSION_TAG" "refs/tags/$VERSION_TAG^{}")" || return 1
            VERIFIED_COMMIT="$(printf '%s\n' "$REMOTE_REFS" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [ -z "$VERIFIED_COMMIT" ]; then
              VERIFIED_COMMIT="$(printf '%s\n' "$REMOTE_REFS" | awk 'NF == 2 { print $1; exit }')"
            fi
            RELEASE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG" \
              --jq '[.draft, .prerelease, .immutable] | @tsv')" || return 1
            IFS=$'\t' read -r IS_DRAFT IS_PRERELEASE IS_IMMUTABLE <<< "$RELEASE_STATE"
            [ "$VERIFIED_COMMIT" = "$GITHUB_SHA" ] && \
              [ "$IS_DRAFT" = false ] && \
              [ "$IS_PRERELEASE" = false ] && \
              [ "$IS_IMMUTABLE" = true ]
          }

          PUBLICATION_VERIFIED=false
          for ATTEMPT in {1..12}; do
            if verify_published_source; then
              PUBLICATION_VERIFIED=true
              break
            fi
            if [ "$ATTEMPT" -lt 12 ]; then
              sleep 5
            fi
          done
          if [ "$PUBLICATION_VERIFIED" != true ]; then
            echo "::error::Could not verify the complete immutable $VERSION_TAG publication within 60 seconds; rerun this version to resume its non-mutating audit"
            exit 1
          fi
          echo "Verified immutable source release, attestation, and exact tag binding for $VERSION_TAG"
