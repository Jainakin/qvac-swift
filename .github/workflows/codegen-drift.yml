name: Pinned Contract Reproducibility

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/codegen/package-lock.json
      - name: Verify authoritative source, published npm parity, and generated bytes
        run: |
          tools/codegen/bootstrap.sh
          tools/codegen/run.sh --generate-only
          test -z "$(git status --porcelain -- \
            Sources/QVACClient/Generated \
            'Tests/QVACClientUnitTests/*.generated.swift')"
