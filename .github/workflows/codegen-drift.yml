name: SDK Contract Drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reproduce:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/codegen/package-lock.json
      - name: Verify pinned source, npm parity, and generated files
        run: |
          tools/codegen/bootstrap.sh
          tools/codegen/run.sh --generate-only
          test -z "$(git status --porcelain -- \
            Sources/QVACClient/Generated \
            'Tests/QVACClientUnitTests/*.generated.swift')"
